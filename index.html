<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Security</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: "Courier New", monospace;
    color: #00ff44;
}

/* MATRIX */

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* DARK OVERLAY */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 1;

    background:
        radial-gradient(
            circle,
            rgba(0,255,60,.08),
            rgba(0,0,0,.92)
        );
}

/* MAIN */

#main {
    position: fixed;
    inset: 0;

    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    padding: 20px;
}

/* HACKED TEXT */

#hacked {
    font-size: clamp(45px, 8vw, 110px);

    font-weight: 900;

    color: #ff1111;

    text-shadow:
        0 0 5px red,
        0 0 20px red,
        0 0 50px red;

    animation:
        glitch .15s infinite,
        pulse 1s infinite;

    margin: 0;
}

/* SUBTEXT */

#sub {
    margin-top: 20px;

    font-size: clamp(18px, 3vw, 30px);

    color: #00ff44;

    text-shadow:
        0 0 10px #00ff44;

    min-height: 35px;
}

/* TERMINAL */

#terminal {

    margin-top: 30px;

    width: min(850px, 90vw);

    max-height: 230px;

    overflow: hidden;

    text-align: left;

    background: rgba(0,0,0,.7);

    border:
        1px solid rgba(0,255,60,.35);

    padding: 18px;

    box-shadow:
        0 0 30px rgba(0,255,60,.15);

    font-size: 15px;

    line-height: 1.8;
}

/* GLITCH */

@keyframes glitch {

    0% {
        transform: translate(0);
    }

    20% {
        transform: translate(-3px, 2px);
    }

    40% {
        transform: translate(3px, -2px);
    }

    60% {
        transform: translate(-2px, -1px);
    }

    80% {
        transform: translate(2px, 2px);
    }

    100% {
        transform: translate(0);
    }
}

@keyframes pulse {

    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: .7;
    }
}

#flash {

    position: fixed;

    inset: 0;

}

}

</style>

<script>

/* =========================
   MATRIX BACKGROUND
========================= */

const canvas =
    document.getElementById("matrix");

const ctx =
    canvas.getContext("2d");

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);

const chars =
    "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%@";

const fontSize = 16;

let columns =
    Math.floor(
        window.innerWidth / fontSize
    );

let drops =
    Array(columns).fill(1);


function matrix() {

    ctx.fillStyle =
        "rgba(0,0,0,.08)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "#00ff44";

    ctx.font =
        fontSize + "px monospace";


    for (
        let i = 0;
        i < drops.length;
        i++
    ) {

        const text =
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

        ctx.fillText(
            text,
            i * fontSize,
            drops[i] * fontSize
        );

        if (
            drops[i] * fontSize >
                canvas.height
            &&
            Math.random() > .975
        ) {

            drops[i] = 0;

        }

        drops[i]++;

    }

}

setInterval(
    matrix,
    35
);


/* =========================
   FAKE TERMINAL
========================= */

const terminal =
    document.getElementById(
        "terminal"
    );

const lines = [

    "> INITIALIZING...",
    "> CONNECTING TO SYSTEM...",
    "> BYPASSING SECURITY...",
    "> ACCESSING MAINFRAME...",
    "> SECURITY LEVEL: 0%",
    "> FIREWALL BYPASSED",
    "> ACCESS GRANTED",
    "> DOWNLOADING SYSTEM DATA...",
    "> ████████████████████ 100%",
    "> SYSTEM COMPROMISED",
    "> USER ACCESS: OVERRIDDEN",
    "> HAHAHAHAHAHAHA..."

];

let lineIndex = 0;


function addLine() {

    if (
        lineIndex >= lines.length
    ) return;

    const line =
        document.createElement("div");

    line.textContent =
        lines[lineIndex];

    terminal.appendChild(line);

    lineIndex++;

    terminal.scrollTop =
        terminal.scrollHeight;

    setTimeout(
        addLine,
        500
    );

}

addLine();


/* =========================
   TEXT CHANGES
========================= */

const sub =
    document.getElementById("sub");

const messages = [

    "CONNECTING...",
    "ACCESSING SYSTEM...",
    "SECURITY BYPASSED...",
    "ACCESS GRANTED...",
    "SYSTEM COMPROMISED..."

];

let msg = 0;


setInterval(() => {

    if (
        msg <
        messages.length
    ) {

        sub.textContent =
            messages[msg];

        msg++;

    }

}, 1200);


/* =========================
   SCREEN FLASH
========================= */

setTimeout(() => {

    const flash =
        document.getElementById(
            "flash"
        );

    flash.style.opacity = "0.5";

    setTimeout(() => {

        flash.style.opacity = "0";

    }, 120);

}, 6000);


/* =========================
   FINAL
========================= */

setTimeout(() => {

    document.getElementById(
        "main"
    ).style.display = "none";

    document.getElementById(
        "final"
    ).style.display = "flex";

}, 8500);


/* =========================
   SOUND
   شروع صدا بعد از اولین کلیک
========================= */

let soundStarted = false;


function startSound() {

    if (soundStarted)
        return;

    soundStarted = true;

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    const audio =
        new AudioContext();

    const now =
        audio.currentTime;


    const osc =
        audio.createOscillator();

    const gain =
        audio.createGain();

    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        70,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        30,
        now + 2
    );

    gain.gain.setValueAtTime(
        0,
        now
    );

    gain.gain.linearRampToValueAtTime(
        .18,
        now + .2
    );

    gain.gain.exponentialRampToValueAtTime(
        .01,
        now + 2.5
    );

    osc.connect(gain);

    gain.connect(
        audio.destination
    );

    osc.start();

    osc.stop(
        now + 2.5
    );

}


/* اولین کلیک = صدا */

document.addEventListener(
    "click",
    startSound,
    { once: true }
);

</script>

</body>
